# cost-portal en produccion (Docker). NO levanta su propia Postgres: se conecta a la
# Postgres CENTRAL, que vive en su propio proyecto Compose (/opt/infra). Asi
# cost-portal, siniestros-automation y el clasificador-correos leen/escriben la MISMA
# api_audit_logs.
#
# COMO SE ALCANZA LA BD: por la red compartida `IA-Central`, hablandole a Postgres por
# el nombre de su servicio (`db:5432`).
#
#   DATABASE_URL=postgresql+asyncpg://benjumea:<PASSWORD>@db:5432/benjumea
#
# NO se usa `host.docker.internal`: la Postgres ya no publica ningun puerto en el host.
services:
  portal:
    build: .
    # Tope de memoria (entorno Plesk compartido, 11 GiB y SIN swap: un contenedor
    # desbocado se lleva por delante al resto). Medido en reposo el 03.09.2026.
    mem_limit: 512m
    env_file: .env
    networks:
      - central
    # Solo loopback: lo expone Plesk/nginx por HTTPS en su subdominio.
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped
    # Espera a Postgres y luego ejecuta el CMD original de la imagen.
    # Este servicio migra sus propias tablas `portal_*` con Alembic al arrancar, asi que
    # sin la espera fallaria la migracion si le gana la carrera a la BD tras un reinicio
    # del servidor. (Solo migra `portal_*`: el dueno del esquema de `api_audit_logs` es
    # siniestros-automation.)
    command: >
      bash -c 'until (echo > /dev/tcp/db/5432) 2>/dev/null; do echo "esperando a Postgres (db:5432)..."; sleep 2; done;
      exec sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $${PORTAL_PORT:-8001} --workers 2"'

networks:
  central:
    external: true
    # Creada por el proyecto `infra` (/opt/infra). Si no existe, `up` falla en el acto
    # con "network not found" — error ruidoso, no una conexion silenciosamente rota.
    name: IA-Central
